<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="preload" href="styles.css" as="style">
    <link rel="stylesheet" href="styles.css">
    <style>html,body{background:#F5F5F5;margin:0;padding:0;}input:invalid,input:required{box-shadow:none!important;outline:none!important;}</style>
</head>
<body>
    <div class="page admin-page">
        <nav class="navbar">
            <div class="container">
                <div class="logo" onclick="window.location.href='admin-dashboard.html'" style="cursor:pointer;">
                    <span class="logo-text">Hi<span class="logo-highlight">speedcity</span></span>
                    <span class="admin-badge">Admin</span>
                </div>
                <button type="button" class="admin-menu-button" id="adminMenuButton" aria-controls="adminDashboardDrawer" aria-expanded="false" data-testid="admin-menu-button">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>

        <div class="admin-drawer-overlay" id="adminDrawerOverlay" hidden></div>
        <aside class="admin-drawer" id="adminDashboardDrawer" aria-hidden="true" aria-label="Admin dashboard menu">
            <div class="admin-drawer__header">
                <div>
                    <p class="admin-drawer__eyebrow">Admin Menu</p>
                    <h2>Quick Actions</h2>
                </div>
                <button type="button" class="admin-drawer__close" id="adminDrawerClose" aria-label="Close menu">&times;</button>
            </div>
            <div class="admin-drawer__body">
                <button type="button" class="admin-drawer__action is-primary" onclick="window.location.href='admin-dashboard.html'" data-testid="dashboard-link">Dashboard</button>
                <button type="button" class="admin-drawer__action" onclick="window.location.href='admin-applications.html'" data-testid="view-applications-btn">View Applications</button>
                <button type="button" class="admin-drawer__action" onclick="window.location.href='admin-renewals.html'" data-testid="view-renewals-btn">Renewal Management</button>
                <button type="button" class="admin-drawer__action" onclick="window.location.href='admin-parking-types.html'" data-testid="view-parking-types-btn">Parking Type Management</button>
                <a href="index.html" class="admin-drawer__action is-logout" data-testid="logout-link">Logout</a>
            </div>
        </aside>

        <div class="container">
            <div class="form-container change-password-container">
                <div class="form-header">
                    <h1 data-testid="change-password-title">Change Password</h1>
                    <p class="form-note">Update the password for the signed-in admin account.</p>
                </div>

                <form id="changePasswordForm" data-testid="change-password-form">
                    <div class="form-section">
                        <h2>Password Details</h2>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="currentPassword">Current Password *</label>
                                <div class="password-field">
                                    <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password" data-testid="current-password-input">
                                    <button type="button" class="password-toggle" data-target="currentPassword" data-testid="toggle-current-password" aria-label="Show current password" aria-pressed="false"></button>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="newPassword">New Password *</label>
                                <div class="password-field">
                                    <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" data-testid="new-password-input">
                                    <button type="button" class="password-toggle" data-target="newPassword" data-testid="toggle-new-password" aria-label="Show new password" aria-pressed="false"></button>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="confirmNewPassword">Confirm New Password *</label>
                                <div class="password-field">
                                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" required autocomplete="new-password" data-testid="confirm-new-password-input">
                                    <button type="button" class="password-toggle" data-target="confirmNewPassword" data-testid="toggle-confirm-password" aria-label="Show confirm password" aria-pressed="false"></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelBtn" data-testid="cancel-password-btn">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="updatePasswordBtn" data-testid="update-password-btn">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="admin-change-password.js"></script>
</body>
</html>
