<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renewal Details</title>
    <link rel="preload" href="styles.css" as="style">
    <link rel="stylesheet" href="styles.css">
    <style>html,body{background:#F5F5F5;margin:0;padding:0;}input:invalid,input:required{box-shadow:none!important;outline:none!important;}</style>
</head>
<body>
    <div class="page admin-page">
        <nav class="navbar">
            <div class="container">
                <div class="logo" onclick="window.location.href='admin-dashboard.html'" style="cursor:pointer;">
                    <span class="logo-text">Hi<span class="logo-highlight">speedcity</span></span>
                    <span class="admin-badge">Admin</span>
                </div>
                <a href="index.html" class="logout-link">Logout</a>
            </div>
        </nav>

        <div class="container">
            <div class="application-details">
                <div class="details-header">
                    <h1>Renewal Request Details</h1>
                    <div class="details-actions">
                        <button class="btn btn-secondary" onclick="window.location.href='admin-renewals.html'">Back to Renewal List</button>
                    </div>
                </div>

                <div class="details-container" id="renewalDetailsContainer"></div>

                <div class="form-actions" id="renewalActionButtons" style="display:none;">
                    <button type="button" class="btn btn-danger" id="renewalRejectBtn">Reject</button>
                    <button type="button" class="btn btn-success" id="renewalApproveBtn">Approve</button>
                </div>
            </div>
        </div>

        <div class="approval-modal" id="renewalApprovalModal" hidden>
            <div class="approval-modal__backdrop" id="renewalApprovalBackdrop"></div>
            <div class="approval-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="renewalApprovalTitle">
                <div class="approval-modal__header">
                    <div>
                        <p class="approval-modal__eyebrow">Admin Approval Form</p>
                        <h2 id="renewalApprovalTitle">Approve Individual Renewal</h2>
                    </div>
                    <button type="button" class="approval-modal__close" id="renewalApprovalCloseBtn" aria-label="Close approval form">×</button>
                </div>

                <div class="approval-modal__body">
                    <div class="approval-modal__section">
                        <h3>Customer Details</h3>
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="approvalCustomerName">Customer Name</label>
                                <input type="text" id="approvalCustomerName" readonly>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="approvalCustomerEmail">Customer Email</label>
                                <input type="email" id="approvalCustomerEmail" readonly>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="approvalVehiclePlates">Vehicle Plate Number(s)</label>
                                <textarea id="approvalVehiclePlates" readonly rows="3"></textarea>
                            </div>
                        </div>
                    </div>

                    <form id="renewalApprovalForm" class="approval-modal__form">
                        <div class="approval-modal__section">
                            <h3>Receipt Information</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="approvalReceiptNumber">Receipt Number</label>
                                    <input type="text" id="approvalReceiptNumber" maxlength="80" placeholder="Auto-generated if left blank">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="approvalProductMonth">Product / Subscription Month *</label>
                                    <input type="text" id="approvalProductMonth" required maxlength="120" placeholder="Example: July 2026">
                                </div>
                                <div class="form-group">
                                    <label for="approvalParkingType">Parking Type *</label>
                                    <input type="text" id="approvalParkingType" required maxlength="60" placeholder="Enter parking type">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="approvalQuantity">Quantity *</label>
                                    <input type="number" id="approvalQuantity" required min="1" step="1" placeholder="1">
                                </div>
                                <div class="form-group">
                                    <label for="approvalUnitPrice">Unit Price (RM) *</label>
                                    <input type="number" id="approvalUnitPrice" required min="0" step="1" placeholder="0">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group full-width">
                                    <label for="approvalTotalAmount">Total Amount (RM) *</label>
                                    <input type="number" id="approvalTotalAmount" required min="0" step="1" placeholder="0" readonly>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group full-width">
                                    <label for="approvalAdditionalNotes">Additional Notes</label>
                                    <textarea id="approvalAdditionalNotes" rows="3" placeholder="Optional"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="approval-modal__actions">
                            <button type="button" class="btn btn-secondary" id="approvalCancelBtn">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="approvalConfirmBtn">Confirm Approval</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="admin-renewal-details.js"></script>
</body>
</html>
